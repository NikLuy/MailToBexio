name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────
  # Job 1: Build + Checks (läuft auf jedem Push & PR)
  # ────────────────────────────────────────────────
  checks:
    name: Build & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Vulnerability scan
        run: |
          echo "## Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          cat vuln.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Pipeline schlägt fehl bei direkten (nicht-transitiven) Schwachstellen.
          # Transitive Abhängigkeiten (z.B. Microsoft.Kiota via Microsoft.Graph)
          # werden gemeldet aber blockieren nicht.
          if dotnet list package --vulnerable 2>&1 | grep -q "has the following vulnerable packages"; then
            echo "::error::Direkte vulnerable Pakete gefunden — bitte updaten!"
            exit 1
          fi

  # ────────────────────────────────────────────────
  # Job 2: Docker Build & Push (nur auf main branch)
  # ────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    needs: checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest bei jedem Main-Push
            type=raw,value=latest
            # SHA für exakte Rückverfolgbarkeit
            type=sha,prefix=sha-
            # Semantic Versioning bei Git-Tags (v1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions Cache: deutlich schnellere Builds bei unverändertem Code
          cache-from: type=gha
          cache-to: type=gha,mode=max
